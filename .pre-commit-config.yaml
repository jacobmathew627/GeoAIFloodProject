# Pre-commit hooks for GeoAI Flood Risk Project
# Install with: pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.0
    hooks:
      - id: black
        language_version: python3.10

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      # `debug-logger` is not a hook in this repo; the real id is
      # `debug-statements` (catches stray breakpoint()/pdb calls).
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-Pillow]
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      - id: pytest-check
        name: Run quick tests
        entry: pytest tests/ -q -p no:warnings
        language: system
        pass_filenames: false
        stages: [pre-commit]
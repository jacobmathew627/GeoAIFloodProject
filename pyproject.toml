[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-flood"
version = "2.0.0"
description = "GeoAI Flood Risk Dashboard for Ernakulam, Kerala"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.42.0",
    "streamlit-folium==0.23.2",
    "folium==0.19.3",
    "rasterio==1.4.3",
    "numpy==1.26.4",
    "pyproj==3.7.1",
    "matplotlib==3.10.1",
    "Pillow==11.1.0",
    "requests==2.32.5",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "scikit-learn==1.5.1",
    "joblib==1.4.2",
    "fastapi==0.111.0",
    "uvicorn==0.30.0",
]

[project.optional-dependencies]
# Only needed for src/inference_final.py, the archived U-Net path.
legacy = ["torch==2.3.0"]
dev = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
    "black==24.4.0",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# pytest configuration lives in pytest.ini. Duplicating it here is a trap:
# pytest.ini wins silently, so edits made in pyproject.toml have no effect.

[tool.ruff]
line-length = 100
target-version = "py310"
# Pre-rewrite architecture, kept only as historical record (see
# docs/artefacts.md). Each one imports nothing that still exists -- they read
# from processed/, which predates align_data.py's rewrite and data_aligned/,
# and nothing in the active pipeline imports any of them. They cannot run
# regardless of lint status, so holding them to current style rules buys
# nothing; excluded rather than silently left to break CI forever.
extend-exclude = [
    "src/data_loader.py",
    "src/hydro_geomorph.py",
    "src/inference.py",
    "src/preprocessing.py",
    # Trains the archived Keras UNet (docs/artefacts.md). tensorflow is not
    # an installed dependency of this project (confirmed: `import tensorflow`
    # fails in .venv) and never has been in requirements.txt/pyproject.toml,
    # so this cannot run here regardless of lint status.
    "src/train_keras_unet.py",
    # The deprecated mock-MCDA generator (docs/artefacts.md) -- raises
    # SystemExit on import on purpose, so its body never executes either way.
    "src/generate_intelligent_predictions.py",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
# `src/` modules import each other by bare name (`from config import ...`),
# not as a package (`from src.config import ...`), which is why CI sets
# MYPYPATH=src. But running `mypy src/` at the same time makes mypy discover
# every file twice -- once as `src.config` via directory-based package
# discovery, once as bare `config` via MYPYPATH -- and it refuses to check
# anything with "Source file found twice under different module names".
# explicit_package_bases is mypy's own documented fix: treat src/ as a
# package root without forcing a `src.` prefix onto every module name.
explicit_package_bases = true
mypy_path = "src"
# Same dead-code list as [tool.ruff] extend-exclude, for the same reason:
# these cannot run in this environment (missing tensorflow, or superseded
# by align_data.py's rewrite with no replacement for processed/), so type
# errors in them are not actionable. See docs/artefacts.md.
exclude = [
    "^src/data_loader\\.py$",
    "^src/hydro_geomorph\\.py$",
    "^src/inference\\.py$",
    "^src/preprocessing\\.py$",
    "^src/train_keras_unet\\.py$",
    "^src/generate_intelligent_predictions\\.py$",
]